<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>H&E + Gene Expression Viewer</title>

    <style>
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
        font-family: sans-serif;
      }

      #root {
        width: 100vw;
        height: 100vh;
      }

      /* OpenSeadragon viewers */
      #viewer1,
      #viewer2,
      #viewer3 {
        width: 100%;
        height: 100%;
      }
    </style>
    <script type="module" crossorigin src="/gene_pred_viewer/assets/index-Cs2RS3TY.js"></script>
  </head>

  <body>
    <!-- HEADER -->
    <header style="
      width: 100%;
      background: #111;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-sizing: border-box;">
      <img src="/gene_pred_viewer/logo.png" alt="Logo" style="height: 50px; width: 76px;" />
      <h1 style="margin: 0; font-size: 28px; font-weight: 600; width: 100%; text-align:center;">
        H&E and Gene Expression Viewer
      </h1>
    </header>

    <!-- CONTROLS -->
    <div style="
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px 16px;
      border-bottom: 1px solid #444;
      gap: 20px;
      flex-wrap: wrap;
      color: white;
    ">

      <div>
        <b>Load H&E Image</b>
        <div style="margin-top:6px;">
          <input id="fileImage" type="file" accept=".png,.jpg,.jpeg" />
        </div>


        <!--
        <div style="margin-top:6px;">
          URL:
          <input id="urlImage" type="text" placeholder="https://example.com/image.jpg">
          <button id="btnLoadImageUrl">Load</button>
        </div>
      -->


      </div>


      

      <div>
        <b>Load Patch Predictions</b>
        <div>
          <input id="filePatchPredictions" type="file" accept=".png,.jpg,.jpeg" multiple />
        </div>
      </div>

      <div>
        <b>Load iStar Predictions</b>
        <div>
          <input id="fileiStarPredictions" type="file" accept=".png,.jpg,.jpeg" multiple />
        </div>
      </div>
    </div>

    <!-- React mount -->
    <div id="root"></div>


    <script>
      document.getElementById("btnLoadImageUrl").onclick = () => {
        const url = document.getElementById("urlImage").value.trim();
        if (!url) return alert("Enter a URL");
        window.onImageUrlLoad?.(url);
      };
    </script>
  </body>
</html>
